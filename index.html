<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Tennis Competition Registration</title>
  </head>
  <body>
    <div class="container">
      <div class="images">
        <div class="image male">
            <span>Photo by <a href="https://unsplash.com/@fei_chao3?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Fei Chao</a> on <a href="https://unsplash.com/photos/a-man-holding-a-tennis-racquet-on-a-tennis-court-iWEPTiRyOH4?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Unsplash</a>
      </span>
        </div>
        <div class="logo">
            <img src="images/Steren_Tennis_ball.svg" width="56" alt="tennis community logo">
          <span>Playtime</span>
        </div>
        <div class="image female">
          <span>Photo by <a href="https://unsplash.com/@gasparzaldo?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">gaspar zaldo</a> on <a href="https://unsplash.com/photos/a-woman-hitting-a-ball-with-a-tennis-racket-XyeaNpKUJyk?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Unsplash</a>
      </span>
        </div>
      </div>
      <div class="registration">
        <div class="form-title"><h1>Tennis Competition</h1></div>
        <div class="description">
          <p>Sign up to compete in our tennis competition!</p>
        </div>
        <div class="form-container">
          <form action="" method="post">
              <fieldset class="sign-up-form">
                <legend>Sign-Up Form</legend>
                  <label for="first_name">FIRST NAME</label>
                  <input type="text" id="first_name" name="first_name" placeholder="John" required>
                  <label for="last_name">LAST NAME</label>
                  <input type="text" id="last_name" name="last_name" placeholder="Doe" required>
                  <label for="mail">EMAIL</label>
                  <input type="email" id="mail" name="user_email" placeholder="youremail@gmail.com" required>
                  <label for="phone">PHONE NUMBER</label>
                  <input type="tel" id="phone" name="user-phone" placeholder="081234567890" pattern="^[\+]?[(]?[0-9]{3}[)]?[-\s\.]?[0-9]{3}[-\s\.]?[0-9]{4,6}$">
                  <label for="password">CREATE PASSWORD</label>
                  <input type="password" id="password" name="user_password" required>
                  <label for="confirm_password">CONFIRM PASSWORD</label>
                  <input type="password" id="confirm_password" name="user_password" required>
              </fieldset>
              <fieldset class="gender">
                <legend>SELECT GENDER</legend>
                <ul>
                  <li>
                    <label for="male">Male</label>
                    <input type="radio" id="male" name="gender" value="male">
                  </li>
                  <li>
                    <label for="female">Female</label>
                    <input type="radio" id="female" name="gender" value="female">
                  </li>
                </ul>
              </fieldset>
              <legend>CHOOSE TOURNAMENT CATEGORY</legend>
                <select name="category" id="category">
                  <option value="beginner-single">Beginner Single</option>
                  <option value="beginner-double">Beginner Double</option>
                  <option value="beginner-mix-double">Beginner Mix Double</option>
                  <option value="intermediate-single">Intermediate Single</option>
                  <option value="intermediate-double">Intermediate Double</option>
                  <option value="intermediate-mix-double">Intermediate Mix Double</option>
                </select>
                <fieldset>
                  <legend>SELECT SKILL LEVEL</legend>
                  <label for="beginner">Beginner</label>
                  <input type="radio" id="beginner" name="level" value="beginner">
                  <label for="upper-beginner">Upper Beginner</label>
                  <input type="radio" id="upper-beginner" name="level" value="upper-beginner">
                  <label for="intermediate">Intermediate</label>
                  <input type="radio" id="intermediate" name="level" value="intermediate">
                  <label for="upper-intermediate">Upper Intermediate</label>
                  <input type="radio" id="upper-intermediate" name="level" value="upper-intermediate">
                </fieldset>
                <fieldset>
                  <legend>PREFERABLE COURT (MAY CHOOSE MORE THAN ONE)</legend>
                  <label for="sanur">Liga Tennis Sanur</label>
                  <input type="checkbox" id="sanur" name="court" value="sanur">
                  <label for="umalas">Liga Tennis Umalas</label>
                  <input type="checkbox" id="umalas" name="court" value="umalas">
                  <label for="ubud">Liga Tennis Ubud</label>
                  <input type="checkbox" id="ubud" name="court" value="ubud">
                </fieldset>
          </form>
      </div>
    </div>
  </body>
</html>
